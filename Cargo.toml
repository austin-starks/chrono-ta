[package]
name = "chrono-ta"
version = "2.1.0"
authors = ["Austin Starks <austin@starks-technology.com>"]
edition = "2021"
description = "Timestamp-aware, duration-windowed technical indicators for Rust"
keywords = ["technical-analysis", "time-series", "indicators", "trading", "simd"]
license = "MIT"
repository = "https://github.com/austin-starks/chrono-ta"
homepage = "https://github.com/austin-starks/chrono-ta"
documentation = "https://docs.rs/chrono-ta"
readme = "README.md"
categories = ["science", "algorithms"]
include = [
    "/src/**/*",
    "/examples/**/*",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/SECURITY.md"
]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
wide = "0.7"

[dev-dependencies]
bincode = "1.3.1"

[profile.release]
lto = true
